  <body>
    <main id="demo">
      <noscript>
        <h1>Pumpkin</h1>
        <p>
          An FFGL source that puts the Test Card's pumpkin patch into Resolume:
          a jack-o'-lantern on every LED tile, each carved with one of six
          faces, its candle flickering and its face blinking, winking or
          chomping in its own time. It isn't a pumpkin like the test card's,
          it's the test card's pumpkin: the drawing, the timing and which face
          lands on which tile are its code, ported line for line and checked
          against the test card itself, so the same seed and tiles deal the same
          patch. Set its clock to the wall and it flickers in step with a test
          card on another machine.
        </p>
        <p>
          This demo runs the plugin's shader and a port of its CPU half in your
          browser, so it needs JavaScript and WebGL2. The plugin itself, its
          source and its downloads are on
          <a href="https://github.com/stoatworks-labs/pumpkin">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/pumpkin/">Project page and downloads</a></li>

          <li><a href="https://github.com/stoatworks-labs/pumpkin">Source on GitHub</a></li>
        </ul>
      </noscript>
